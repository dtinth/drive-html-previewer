# Deploys each PR to a temporary Firebase Hosting preview channel and posts the
# preview URL as a single, updated PR comment. Keyless auth via GitHub OIDC →
# Google Cloud Workload Identity Federation (same config as the merge workflow,
# no secrets). Skipped for fork PRs, which can't mint tokens for this provider.
# Delete this file if you don't want per-PR previews.
name: Deploy PR preview to Firebase Hosting

on: pull_request

permissions:
  contents: read
  id-token: write # required so the runner can mint an OIDC token
  pull-requests: write # to post the preview-URL comment

jobs:
  deploy_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # See the merge workflow for why token_format:access_token + FIREBASE_TOKEN
      # (firebase-tools can't use the WIF external_account credentials file).
      - name: Authenticate to Google Cloud (OIDC, keyless)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: drive-html-previewer
          workload_identity_provider: projects/872159808085/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@drive-html-previewer.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Deploy to preview channel
        id: preview
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
          # Keep the log warning-free: quiet npm's transitive-dep deprecation
          # notices and the punycode deprecation emitted from a firebase-tools dep.
          npm_config_loglevel: error
          NODE_OPTIONS: --disable-warning=DEP0040
        run: |
          # Print the error JSON on failure (firebase writes it to stdout with --json).
          npx --yes firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project drive-html-previewer --expires 7d --json --non-interactive > result.json \
            || { echo "firebase failed:"; cat result.json; exit 1; }
          cat result.json
          URL=$(node -e "const r=(require('./result.json').result)||{};let u='';for(const v of Object.values(r)){if(v&&v.url){u=v.url;break}}process.stdout.write(u)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v9
        with:
          script: |
            const url = ${{ toJSON(steps.preview.outputs.url) }};
            const marker = '<!-- firebase-preview -->';
            const body = `${marker}\n🔥 **Firebase preview** deployed: ${url}\n\n_Channel \`pr-${{ github.event.number }}\` · expires in 7 days._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
